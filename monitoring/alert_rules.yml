groups:
  - name: superstore-api
    rules:
      - alert: ApiDown
        expr: up{job="superstore-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Model API is not responding to scrapes"}

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 500 ms"}

      - alert: HighErrorRate
        expr: sum(rate(api_requests_total{endpoint="/predict",status=~"5.."}[5m])) / sum(rate(api_requests_total{endpoint="/predict"}[5m])) > 0.02
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 2% of /predict requests fail"}

      # Simple drift signal: share of "loss" predictions far from the 2017 test rate (~19%)
      - alert: PredictionMixShift
        expr: sum(rate(model_predictions_total{label="loss"}[1h])) / sum(rate(model_predictions_total[1h])) > 0.35
        for: 30m
        labels: {severity: info}
        annotations: {summary: "Share of predicted losses has shifted; check input data and retrain"}
